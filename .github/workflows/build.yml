name: Build JexClient

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jexclient-jar
          path: build/libs/*.jar

      - name: Create/Update release with latest jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JexClient (otomatik derleme)"
          body: "Bu, en son koddan otomatik derlenmiş jar dosyasıdır. build/libs içindeki -sources.jar olmayan dosyayı .minecraft/mods klasörüne koy."
          files: build/libs/*.jar
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
